<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEA9F" stop-opacity="1"/>
      <stop offset="60%" stop-color="#E9C578" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E9C578" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#226B4A"/>
      <stop offset="50%" stop-color="#123D2B"/>
      <stop offset="100%" stop-color="#082016"/>
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#5C3A1E"/>
    </linearGradient>
  </defs>

  <!-- Background circular badge -->
  <circle cx="32" cy="32" r="30" fill="#09271E" stroke="#E9C578" stroke-width="2"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#E9C578" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Tree Trunk -->
  <rect x="29" y="47" width="6" height="7" rx="1.5" fill="url(#trunkGrad)"/>

  <!-- Tree Layers -->
  <!-- Bottom tier -->
  <path d="M16 48 L48 48 L41 38 L45 38 L38 28 L42 28 L32 14 L22 28 L26 28 L19 38 L23 38 Z" fill="url(#treeGrad)" stroke="#1A5338" stroke-width="0.5"/>

  <!-- Snow caps on branches -->
  <path d="M26 48 Q32 44 38 48" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M28 38 Q32 35 36 38" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M30 28 Q32 26 34 28" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Golden Solstice Star atop tree -->
  <g transform="translate(32, 14)">
    <circle cx="0" cy="0" r="5" fill="url(#goldGlow)"/>
    <path d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z" fill="#FFD700"/>
  </g>

  <!-- Twinkles -->
  <circle cx="18" cy="22" r="1" fill="#FFEA9F" opacity="0.8"/>
  <circle cx="46" cy="24" r="1.2" fill="#FFEA9F" opacity="0.9"/>
  <circle cx="44" cy="42" r="0.8" fill="#FFFFFF" opacity="0.7"/>
</svg>
